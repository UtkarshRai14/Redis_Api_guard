# Render Blueprint: the API server plus the Redis (Key Value) instance it uses.
# Both are in the same region so the server reaches Redis over Render's private network.

services:
  - type: web
    name: redis-api-guard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis-api-guard-kv
          property: connectionString
      # Requests reach the app through Cloudflare, Render's internal proxies (10.x) and a
      # proxy on the instance itself (::1). Trusting exactly those hops makes req.ip the
      # real client. Cloudflare ranges: https://www.cloudflare.com/ips/
      - key: TRUST_PROXY
        value: "loopback,uniquelocal,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

  - type: keyvalue
    name: redis-api-guard-kv
    plan: free
    region: singapore
    ipAllowList: [] # private network only
