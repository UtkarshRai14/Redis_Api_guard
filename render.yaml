# Render Blueprint: the API server plus the Redis (Key Value) instance it uses.
# Both are in the same region so the server reaches Redis over Render's private network.

services:
  - type: web
    name: redis-api-guard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis-api-guard-kv
          property: connectionString
      # Render forwards requests through internal proxies (10.x addresses) and then a
      # proxy on the instance itself (::1). Trusting loopback and private-network proxies
      # makes req.ip the first public address: the real client.
      - key: TRUST_PROXY
        value: loopback,uniquelocal

  - type: keyvalue
    name: redis-api-guard-kv
    plan: free
    region: singapore
    ipAllowList: [] # private network only
